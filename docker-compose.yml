services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: juhoon
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: juhoon
      DB_PASSWORD: mysecretpassword
      DB_NAME: postgres
    ports:
      - "8080:8000"